{% extends "base.html" %}

{% block start %}
<div class="container mt-5">
    <form class="col-6 mx-auto card p-4 shadow-lg" method="POST" enctype="multipart/form-data">
         {% csrf_token %}
        <h2>Add Receipe</h2>
        <div class="mb-3">
            <label for="receipeName" class="form-label">Receipe Name</label>
            <input type="text" class="form-control" id="receipeName" name="receipeName" required>
        </div>
        <div class="mb-3">
            <label for="receipeDescription" class="form-label">Receipe Description</label>
            <textarea class="form-control" name="receipeDescription" id="receipeDescription" required></textarea>
        </div>
        <div class="mb-3">
            <label for="receipeImage" class="form-label">Receipe Image</label>
            <input type="file" class="form-control" id="receipeImage" name="receipeImage">
        </div>
        <button type="submit" class="btn btn-success">Add Receipe</button>
    </form>
</div>
{% endblock %}
